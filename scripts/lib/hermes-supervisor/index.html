<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes · Live sessions</title>
  <link rel="stylesheet" href="/style.css" />
  <header>
    <div>
      <div class="eyebrow">Supervised workspace</div>
      <h1 class="brand">Hermes · Live sessions</h1>
      <div class="sub">Two agents, one view. Codex coordinates the work.</div>
    </div>
    <div class="toolbar">
      <a
        class="studio-link"
        href="http://127.0.0.1:4317/"
        target="_blank"
        rel="noopener noreferrer"
        title="Open the Genobi studio. Following the agent’s exact project is not connected yet."
        >Open Genobi ↗</a
      ><span id="budget" class="sub">Comfy budget: loading…</span
      ><span id="connection" class="connection" role="status">Connecting…</span
      ><label><input id="follow" type="checkbox" checked />Follow latest</label
      ><label><input id="tools" type="checkbox" checked />Tool activity</label
      ><button id="pause">Pause view</button>
    </div>
  </header>
  <main id="panels"></main>
  <footer>
    <span
      >Local session messages · refreshes every 2 seconds · latest 180 records
      per session</span
    ><span>Tool arguments, raw results and private reasoning are omitted.</span>
  </footer>
  <script id="configuration" type="application/json">
    __SUPERVISOR_CONFIG__
  </script>
  <script src="/viewer.js"></script>
</html>
