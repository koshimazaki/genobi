name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a quick follow-up commit should not leave two runs racing.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR checks can stop. A main run may already be migrating or
  # deploying production, so let it finish and serialize deployment below.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: the lockfile is committed, so CI installs
      # the exact tree the author tested against.
      - name: Install
        run: npm ci

      # Ordered cheapest-first, so an obvious failure reports in seconds
      # rather than after a full build.
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Director schema freshness
        run: npm run check:director-validators
      # Every docs/ page has known tags and a summary, its relative links and
      # anchors resolve, the wiki home links it, and docs/index.json is current.
      - name: Wiki tags, links and index
        run: npm run check:wiki
      # plugins/genobi/registry.json and docs/registry*.md match the MCP tool
      # definitions and the skills' frontmatter; tags and linked docs exist.
      - name: Tool and skill registry
        run: npm run check:registry
      # plugins/genobi/capabilities.json names every registry tool and skill,
      # its tools, skills and docs exist, each verified feature points at a
      # dated record, and docs/capabilities.md is rendered from it.
      - name: Capability map
        run: npm run check:capabilities
      # Every production npm package declares an allowed licence, and
      # LICENCES-npm.md matches package-lock.json.
      - name: Dependency licences
        run: npm run check:licences
      # No tracked source file over 500 lines, outside the commented allowlist
      # of generated files in scripts/check-file-size.mjs.
      - name: File size
        run: npm run check:size
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Offline evidence-contract tests only; no GPU, network or paid job.
      - name: Audiovisual qualification fixtures
        run: python3 -B -m unittest discover -s workflows/qualification -p 'test_*.py' -v
      - name: Vast worker offline safety tests
        run: python3 -B -m unittest discover -s scripts/vast -p 'test_*.py' -v
      - name: LTX candidate runner offline tests
        run: python3 -B -m unittest discover -s workflows/experiments -p 'test_*.py' -v
      - name: Build
        run: npm run build
      # The World Builder node's standalone bundle builds from src/world-builder
      # and two builds are identical (the bundle itself is gitignored).
      - name: Scene adapter bundle
        run: npm run check:scene-adapter

      # Optional review download, never consumed by deployment (it rebuilds).
      # Storage exhaustion must not turn passing verification into a failure.
      - name: Upload build output
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 1

  cloudflare:
    name: Cloudflare boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Keep the workflow reusable on a tree without the adapter. Wrangler
      # config is present in this repository, so this runs on every PR/main push.
      - name: Detect Cloudflare port
        id: detect
        run: |
          if [ -f wrangler.jsonc ] || [ -f wrangler.toml ] || [ -f wrangler.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Wrangler config found — running boundary checks."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Wrangler config on this ref — skipping."
          fi

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: npm ci

      # The real portability gate. worker/tsconfig.json compiles shared/ and
      # the three portable server modules under "types": [] and lib ES2022 —
      # no Node, no DOM. A stray `node:fs` in the portable layer fails here
      # while every other check stays green.
      - name: Worker types (portable layer stays portable)
        if: steps.detect.outputs.present == 'true'
        run: npm run check:worker

      # The Worker serves ./dist through its ASSETS binding, so wrangler
      # refuses to bundle without it ("assets.directory ... does not exist").
      # Building here keeps this job independent of `verify` rather than
      # chaining the two through an artifact.
      - name: Build assets for the Worker
        if: steps.detect.outputs.present == 'true'
        run: npm run build

      # --dry-run bundles the Worker and validates bindings, compatibility
      # flags and asset config without contacting the API, so it needs no
      # credentials and cannot deploy from a pull request.
      - name: Wrangler config and bundle
        if: steps.detect.outputs.present == 'true'
        run: npx wrangler deploy --dry-run --outdir "${RUNNER_TEMP}/wrangler-dry-run"

      # D1 is SQLite. Replaying the migrations in order against a scratch
      # database catches bad DDL and ordering mistakes before they reach a
      # real database, where partially-applied migrations are expensive.
      - name: D1 migrations replay
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ ! -d migrations ]; then
            echo "No migrations directory — nothing to replay."
            exit 0
          fi
          db="${RUNNER_TEMP}/d1-replay.sqlite"
          rm -f "$db"
          for migration in $(ls migrations/*.sql | sort); do
            echo "Applying ${migration}"
            sqlite3 "$db" < "$migration"
          done
          echo "Resulting schema:"
          sqlite3 "$db" ".tables"

  deploy:
    name: Deploy production
    # Production has one source: the public koshimazaki/genobi repository.
    # This file is shared with the private camera-director repository, where
    # the guard keeps the job from running even if a credential is added.
    if: >-
      github.repository == 'koshimazaki/genobi' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://genobi.pages.dev
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      # Same shape as "Detect Cloudflare port" above: an unconfigured
      # deployment is a skip, not a failure. A fork of this repository, or this
      # one before its token exists, keeps a green `main` and starts deploying
      # by itself the moment the credential is added — with no workflow edit.
      # Only the presence of the secret is tested; its value is never printed,
      # compared or written to an output.
      - name: Detect deployment credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Production credentials found — deploying."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No production credentials — skipping deploy. Add CLOUDFLARE_API_TOKEN"
            echo "and CLOUDFLARE_ACCOUNT_ID to the production environment to enable it."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      # No credential in this step's environment: `npm ci` runs dependency
      # lifecycle scripts, and they have no reason to see a deployment token.
      - name: Install
        if: steps.creds.outputs.present == 'true'
        run: npm ci

      # Build before touching production data. Pages receives this exact bundle
      # only after the additive migrations have succeeded.
      - name: Build production Pages bundle
        if: steps.creds.outputs.present == 'true'
        run: npm run build:pages

      - name: Apply D1 migrations
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply flux-studio-lite --remote --config wrangler.pages.json

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-pages.mjs

      - name: Smoke-check production
        if: steps.creds.outputs.present == 'true'
        run: curl --fail --silent --show-error --retry 6 --retry-delay 5 https://genobi.pages.dev/api/health
